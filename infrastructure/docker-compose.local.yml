# ==============================================================================
# LOHNOUR PRO - LOCAL TESTING DOCKER COMPOSE SPECIFICATION
# Project: lohnour-local
# Target: Windows Docker Desktop (WSL2)
# ==============================================================================

name: lohnour-local

services:
  # ----------------------------------------------------------------------------
  # Web Application: WordPress (Apache runtime)
  # ----------------------------------------------------------------------------
  wordpress:
    image: wordpress:7.1.4-php8.2-apache
    container_name: lohnour-local-wordpress
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${LOCAL_DB_NAME:-lohnour_local_wp}
      WORDPRESS_DB_USER: ${LOCAL_DB_USER:-lohnour_local_user}
      WORDPRESS_DB_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD is required}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_DEBUG: 1
      WORDPRESS_CONFIG_EXTRA: |
        // Force local URL overrides to prevent canonical redirect to production
        define('WP_HOME', 'http://localhost:8080');
        define('WP_SITEURL', 'http://localhost:8080');
        define('WP_ENVIRONMENT_TYPE', 'local');
        define('WP_DEBUG_LOG', true);
        define('WP_DEBUG_DISPLAY', false);

        // Safety: Pluggable stub to disable outbound email in local testing
        if (!function_exists('wp_mail')) {
            function wp_mail() { return true; }
        }
    volumes:
      - lohnour_local_wp_data:/var/www/html
      - ./config/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
      - "./current source/lohnourpro_wp_theme:/var/www/html/wp-content/themes/twentytwentyfive-child:ro"
    networks:
      - lohnour_local_network
    depends_on:
      db:
        condition: service_healthy

  # ----------------------------------------------------------------------------
  # Database Engine: MariaDB (LTS)
  # ----------------------------------------------------------------------------
  db:
    image: mariadb:10.11.19
    container_name: lohnour-local-db
    restart: unless-stopped
    # Zero host ports published to protect local environment
    environment:
      MYSQL_ROOT_PASSWORD: ${LOCAL_DB_ROOT_PASSWORD:?LOCAL_DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${LOCAL_DB_NAME:-lohnour_local_wp}
      MYSQL_USER: ${LOCAL_DB_USER:-lohnour_local_user}
      MYSQL_PASSWORD: ${LOCAL_DB_PASSWORD:?LOCAL_DB_PASSWORD is required}
    volumes:
      - lohnour_local_db_data:/var/lib/mysql
    networks:
      - lohnour_local_network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  lohnour_local_wp_data:
    name: lohnour_local_wp_data
  lohnour_local_db_data:
    name: lohnour_local_db_data

networks:
  lohnour_local_network:
    name: lohnour_local_network
